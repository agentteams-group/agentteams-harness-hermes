name: Hermes Harness

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest pyyaml httpx rich typer
      - run: make test
      - run: bash -n scripts/hermes-worker-entrypoint.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make build VERSION=ci
      - run: make smoke VERSION=ci
      - name: Upgrade an existing v0.22.7 Worker
        run: python3 tests/upgrade_e2e.py --new-image ghcr.io/agentteams-group/agentteams-harness-hermes:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-upgrade-evidence
          path: upgrade-evidence/
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make push VERSION="$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - run: docker buildx imagetools inspect "ghcr.io/agentteams-group/agentteams-harness-hermes:$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
